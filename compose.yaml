name: goldensoft

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goldensoft}
      POSTGRES_USER: ${POSTGRES_USER:-goldensoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goldensoft} -d ${POSTGRES_DB:-goldensoft}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-goldensoft}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-goldensoft}
      SECRET_KEY: ${SECRET_KEY:-}
      CUSTOMER_ADMIN_USERNAME: ${CUSTOMER_ADMIN_USERNAME:-}
      CUSTOMER_ADMIN_PASSWORD: ${CUSTOMER_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    command: ["sh", "-c", "python -m flask --app app init-db && exec gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 8 --timeout 20 app:app"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5001}:5000"
    restart: unless-stopped
    networks: [internal]
  frontend:
    build: ./pinargold-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    restart: unless-stopped
    networks: [internal]
networks:
  internal:
volumes:
  postgres_data:
