name: projedeneme
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projedeneme}
      POSTGRES_USER: ${POSTGRES_USER:-projedeneme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projedeneme} -d ${POSTGRES_DB:-projedeneme}"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-projedeneme}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-projedeneme}
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
volumes:
  postgres_data:
